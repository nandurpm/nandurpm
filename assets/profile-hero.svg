<!--
FILE: profile-hero.svg
FILE PURPOSE: Accessible engineering-themed banner displayed at the top of the public GitHub profile README.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Nandakumar M — Electrical Design and Development Engineer</title>
  <desc id="desc">A dark blue engineering-themed profile banner with a circuit-grid pattern and the text Nandakumar M.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0c2740"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#b9e6f2" stroke-opacity="0.09"/>
      <circle cx="3" cy="3" r="1.7" fill="#b9e6f2" fill-opacity="0.28"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="26" fill="url(#grid)"/>
  <path d="M0 244C180 207 264 278 436 238S724 185 864 224s220 37 336-9V300H0Z" fill="#06101d" fill-opacity="0.56"/>
  <g fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.9" filter="url(#glow)">
    <path d="M876 68h86l22 22h108"/>
    <path d="M902 106h50l20-20h72"/>
    <path d="M850 144h94l18 18h95"/>
    <path d="M920 194h46l23-23h87"/>
  </g>
  <g fill="#a7f3d0">
    <circle cx="984" cy="90" r="4"/><circle cx="974" cy="86" r="4"/><circle cx="962" cy="162" r="4"/><circle cx="989" cy="171" r="4"/><circle cx="1010" cy="194" r="4"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#f8fafc">
    <text x="78" y="122" font-size="54" font-weight="800" letter-spacing="-1">Nandakumar M</text>
    <text x="82" y="166" font-size="22" fill="#c7e8f0">Electrical Design &amp; Development Engineer</text>
    <text x="82" y="216" font-size="15" fill="#94cbd8">Electrical systems · engineering documentation · practical automation</text>
  </g>
  <rect x="82" y="238" width="188" height="4" rx="2" fill="url(#accent)"/>
</svg>
